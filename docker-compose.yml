services:

  db:
    # Última versión estable: postgres:18-alpine (Nota: si tu volumen postgres_data ya fue creado con PG 16, haz backup antes de cambiar de 16 a 18 o usa postgres:16-alpine)
    image: postgres:18-alpine
    container_name: suiche7b_postgres_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-ciberseguridad_db}
      POSTGRES_USER: ${DB_USER:-s7b_security_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Suiche7B_SecurePassword_2026!}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER:-s7b_security_admin} -d ${DB_NAME:-ciberseguridad_db}' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s7b_security_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suiche7b_ciberseguridad_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - '8085'
    environment:
      NODE_ENV: production
      PORT: 8085
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ciberseguridad_db}
      DB_USER: ${DB_USER:-s7b_security_admin}
      DB_PASSWORD: ${DB_PASSWORD:-Suiche7B_SecurePassword_2026!}
      CORS_ORIGIN: 'https://academiasi.suiche7b.com'
      RATE_LIMIT_WINDOW_MINUTES: 15
      RATE_LIMIT_MAX_REQUESTS: 300
      AD_URL: ${AD_URL}
      AD_BASE_DN: ${AD_BASE_DN}
      AD_DOMAIN: ${AD_DOMAIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-Suiche7B_CyberShield_JWT_Secret_2026!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - s7b_security_net
      - bitwarden_default # Red compartida con passbolt-nginx

volumes:
  postgres_data:
    driver: local

networks:
  s7b_security_net:
    driver: bridge
  bitwarden_default:
    external: true # Red existente — no la creamos nosotros
    name: bitwarden_default
